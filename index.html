                    <div key={h.dia} className="horario-row">
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <Toggle on={h.activo} onChange={v => setH(i,"activo",v)}/>
                        <span style={{ fontSize:13, color: h.activo ? "#1F2937" : "#9CA3AF" }}>{h.dia}</span>
                      </div>
                      <input className="form-input" type="time" value={h.desde} disabled={!h.activo} style={{ opacity: h.activo ? 1 : .4, padding:"7px 10px" }} onChange={e => setH(i,"desde",e.target.value)}/>
                      <input className="form-input" type="time" value={h.hasta} disabled={!h.activo} style={{ opacity: h.activo ? 1 : .4, padding:"7px 10px" }} onChange={e => setH(i,"hasta",e.target.value)}/>
                      <span style={{ fontSize:12, color: h.activo ? "var(--green)" : "#9CA3AF", fontWeight:500 }}>{h.activo ? "Abierto" : "Cerrado"}</span>
                    </div>
                  ))}
                  <div style={{ marginTop:16, display:"flex", justifyContent:"flex-end" }}>
                    <button className="btn btn-primary btn-sm" onClick={() => addToast("Horarios guardados")}><Ico n="check" s={13}/>Guardar horarios</button>
                  </div>
                </div>
              </div>
            </>
          )}

          {sec === "notif" && (
            <>
              {[
                { title:"WhatsApp", sub:"Vía Twilio", badge:<span className="badge badge-green">Conectado</span>, items:[{k:"wa_rec",lbl:"Recordatorio de turno",sub:"24hs antes"},{k:"wa_conf",lbl:"Confirmación",sub:"Al agendar"},{k:"wa_canc",lbl:"Cancelación",sub:"Al cancelar"}], extraWA:true },
                { title:"Email", sub:"Vía Resend", badge:<span className="badge badge-green">Conectado</span>, items:[{k:"email_rec",lbl:"Recordatorio",sub:"Mismo horario WA"},{k:"email_conf",lbl:"Confirmación",sub:"Copia al paciente"}] },
                { title:"Notificaciones", sub:"En la aplicación", badge:null, items:[{k:"push_nuevo",lbl:"Nuevo paciente",sub:"Al registrarse"},{k:"push_hoy",lbl:"Resumen del día",sub:"Todos los días 8am"},{k:"push_sin",lbl:"Sin seguimiento",sub:"Pacientes +3 meses"}] },
              ].map(g => (
                <div key={g.title} className="settings-section" style={{ marginBottom:16 }}>
                  <div className="settings-section-header">
                    <div><div className="settings-section-title">{g.title}</div><div className="settings-section-sub">{g.sub}</div></div>
                    {g.badge}
                  </div>
                  <div className="settings-body">
                    {g.items.map(n => (
                      <div key={n.k} className="settings-row">
                        <div><div className="settings-row-label">{n.lbl}</div><div className="settings-row-sub">{n.sub}</div></div>
                        <Toggle on={notif[n.k]} onChange={v => setNo(n.k, v)}/>
                      </div>
                    ))}
                    {g.extraWA && (
                      <div className="settings-row" style={{ flexDirection:"column", alignItems:"flex-start", gap:10 }}>
                        <div className="settings-row-label">Anticipación del recordatorio</div>
                        <div style={{ display:"flex", gap:8 }}>
                          {["12","24","48"].map(h => (
                            <button key={h} onClick={() => setNo("hs",h)} className={`filter-chip ${notif.hs===h?"active":""}`}>{h}hs</button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              ))}
              <div style={{ display:"flex", justifyContent:"flex-end" }}>
                <button className="btn btn-primary" onClick={() => addToast("Preferencias guardadas")}><Ico n="check" s={14}/>Guardar preferencias</button>
              </div>
            </>
          )}

          {sec === "plan" && (
            <>
              <div className="settings-section" style={{ marginBottom:16 }}>
                <div className="settings-section-header">
                  <div><div className="settings-section-title">Tu plan actual</div><div className="settings-section-sub">Premium · Renueva el 01/05/2026</div></div>
                  <span className="badge badge-green">Premium activo</span>
                </div>
                <div className="settings-body">
                  <div className="plan-grid">
                    {PLANS.map(plan => (
                      <div key={plan.id} className={`plan-card ${plan.active?"plan-active":""}`} style={{ position:"relative" }}>
                        {plan.active && <div className="plan-badge">Plan actual</div>}
                        <div className="plan-name">{plan.lbl}</div>
                        <div className="plan-price">{plan.price}</div>
                        {plan.feat.map(f => <div key={f} className="plan-feature">{f}</div>)}
                        {!plan.active && (
                          <button className="btn btn-secondary" style={{ width:"100%", justifyContent:"center", marginTop:14, fontSize:12 }} onClick={() => addToast(plan.id==="enterprise"?"Contactando ventas...":"Procesando cambio...")}>
                            {plan.id === "enterprise" ? "Contactar ventas" : "Cambiar a este plan"}
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              <div className="settings-section">
                <div className="settings-section-header"><div className="settings-section-title">Historial de pagos</div></div>
                <table className="table">
                  <thead><tr><th>Fecha</th><th>Descripción</th><th>Monto</th><th>Estado</th><th></th></tr></thead>
                  <tbody>
                    {FACTS.map((f,i) => (
                      <tr key={i}>
                        <td style={{ color:"#6B7280", fontSize:12 }}>{f.fecha}</td>
                        <td style={{ fontWeight:500 }}>{f.desc}</td>
                        <td style={{ fontWeight:600 }}>{f.monto}</td>
                        <td><span className="badge badge-green">✓ Pagado</span></td>
                        <td><button className="btn btn-icon btn-ghost" onClick={() => addToast("Descargando...")}><Ico n="clip" s={14}/></button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {sec === "seguridad" && (
            <>
              <div className="settings-section" style={{ marginBottom:16 }}>
                <div className="settings-section-header"><div><div className="settings-section-title">Cambiar contraseña</div><div className="settings-section-sub">Mínimo 8 caracteres</div></div></div>
                <div className="settings-body">
                  <div className="form-group"><label className="form-label">Contraseña actual</label><input className="form-input" type="password" placeholder="••••••••" value={seg.pw_actual} onChange={e => setSeg(s => ({...s,pw_actual:e.target.value}))}/></div>
                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Nueva contraseña</label>
                      <input className="form-input" type="password" placeholder="Mínimo 8 caracteres" value={seg.pw_nueva} onChange={e => setSeg(s => ({...s,pw_nueva:e.target.value}))}/>
                      {seg.pw_nueva && <><div className="pw-bar"><div className="pw-fill" style={{ width:`${str.w}%`, background:str.c }}/></div><div style={{ fontSize:11, color:str.c, marginTop:4, fontWeight:500 }}>{str.t}</div></>}
                    </div>
                    <div className="form-group">
                      <label className="form-label">Confirmar contraseña</label>
                      <input className="form-input" type="password" placeholder="Repetir" value={seg.pw_conf} style={{ borderColor: seg.pw_conf && seg.pw_conf !== seg.pw_nueva ? "#DC2626" : "" }} onChange={e => setSeg(s => ({...s,pw_conf:e.target.value}))}/>
                      {seg.pw_conf && seg.pw_conf !== seg.pw_nueva && <div style={{ fontSize:11, color:"#DC2626", marginTop:4 }}>Las contraseñas no coinciden</div>}
                    </div>
                  </div>
                  <div style={{ display:"flex", justifyContent:"flex-end" }}>
                    <button className="btn btn-primary btn-sm" onClick={() => { if(!seg.pw_actual){addToast("Ingresá tu contraseña actual");return;} if(seg.pw_nueva.length<8){addToast("Mínimo 8 caracteres");return;} if(seg.pw_nueva!==seg.pw_conf){addToast("Las contraseñas no coinciden");return;} setSeg(s=>({...s,pw_actual:"",pw_nueva:"",pw_conf:""})); addToast("Contraseña actualizada"); }}><Ico n="check" s={13}/>Actualizar</button>
                  </div>
                </div>
              </div>

              <div className="settings-section" style={{ marginBottom:16 }}>
                <div className="settings-section-header">
                  <div><div className="settings-section-title">Autenticación de dos factores</div><div className="settings-section-sub">Capa extra de seguridad</div></div>
                  <Toggle on={seg.doble} onChange={v => { setSeg(s => ({...s,doble:v})); addToast(v ? "2FA activado" : "2FA desactivado"); }}/>
                </div>
                {!seg.doble && <div className="settings-body"><div style={{ background:"#FEF3C7", border:"1px solid #FDE68A", borderRadius:8, padding:"10px 14px", fontSize:13, color:"#D97706" }}>Activar el doble factor protege los datos de tus pacientes.</div></div>}
              </div>

              <div className="settings-section" style={{ marginBottom:16 }}>
                <div className="settings-section-header">
                  <div><div className="settings-section-title">Sesiones activas</div></div>
                  <button className="btn btn-danger btn-sm" onClick={() => addToast("Sesiones cerradas")}><Ico n="logout" s={13}/>Cerrar todas</button>
                </div>
                <div className="settings-body">
                  {seg.sesiones.map(s => (
                    <div key={s.id} className="session-row">
                      <div className="session-icon"><span style={{ fontSize:18 }}>{s.ico}</span></div>
                      <div style={{ flex:1 }}><div style={{ fontSize:13, fontWeight:500 }}>{s.dis}</div><div style={{ fontSize:11, color:"#9CA3AF", marginTop:1 }}>{s.lugar} · {s.ul}</div></div>
                      {s.activa
                        ? <span className="badge badge-green">Esta sesión</span>
                        : <button className="btn btn-secondary btn-sm" onClick={() => { setSeg(prev => ({...prev,sesiones:prev.sesiones.filter(x=>x.id!==s.id)})); addToast("Sesión cerrada"); }}>Cerrar</button>}
                    </div>
                  ))}
                </div>
              </div>

              <div className="settings-section" style={{ border:"1px solid #FECACA" }}>
                <div className="settings-section-header" style={{ background:"#FFF5F5" }}>
                  <div><div className="settings-section-title" style={{ color:"#DC2626" }}>Zona de peligro</div><div className="settings-section-sub">Acciones irreversibles</div></div>
                </div>
                <div className="settings-body">
                  <div className="settings-row">
                    <div><div className="settings-row-label">Exportar mis datos</div><div className="settings-row-sub">ZIP con todos los pacientes e historial</div></div>
                    <button className="btn btn-secondary btn-sm" onClick={() => addToast("Preparando exportación...")}><Ico n="clip" s={13}/>Exportar</button>
                  </div>
                  <div className="settings-row">
                    <div><div className="settings-row-label" style={{ color:"#DC2626" }}>Eliminar cuenta</div><div className="settings-row-sub">Acción permanente e irreversible</div></div>
                    <button className="btn btn-danger btn-sm" onClick={() => addToast("Contactá soporte para eliminar tu cuenta")}><Ico n="trash" s={13}/>Eliminar</button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── CONSULTA FULLPAGE ───────────────────────────────────────
function ConsultaPage({ pac, onClose, onSave }) {
  const [f, setF] = useState({ motivo:"", fecha:new Date().toISOString().split("T")[0], presion_sis:"", presion_dia:"", fc:"", temp:"", spo2:"", peso:"", talla:"", examen_fisico:"", dx_consulta:"", indicaciones:"", estudios:"", meds_consulta:"", meds_cambios:"", receta:false, proxima_fecha:"", proxima_motivo:"", notas:"" });
  const [busy, setBusy] = useState(false);
  const set = (k,v) => setF(p => ({...p,[k]:v}));

  const imc = f.peso && f.talla ? (parseFloat(f.peso)/Math.pow(parseFloat(f.talla)/100,2)).toFixed(1) : null;
  const imcLbl = imc ? (imc<18.5?"Bajo peso":imc<25?"Normal":imc<30?"Sobrepeso":"Obesidad") : null;
  const imcC   = imc ? (imc<18.5?"#D97706":imc<25?"#16A34A":imc<30?"#D97706":"#DC2626") : null;

  const save = async () => {
    if (!f.motivo) return;
    setBusy(true); await new Promise(r => setTimeout(r, 600));
    onSave(f); setBusy(false);
  };

  const Sec = ({ title, children }) => (
    <div className="cp-sec">
      <div className="cp-sec-header">{title}</div>
      <div className="cp-sec-body">{children}</div>
    </div>
  );

  return (
    <div className="cp-overlay">
      <div className="cp-topbar">
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <button className="btn btn-ghost btn-icon" onClick={onClose}><Ico n="x" s={16}/></button>
          <div>
            <div style={{ fontSize:17, fontWeight:600 }}>Nueva Consulta</div>
            <div style={{ fontSize:12, color:"#6B7280", marginTop:1 }}>{new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" disabled={busy||!f.motivo} onClick={save}>{busy?<div className="spinner"/>:<Ico n="check" s={14}/>}Registrar</button>
        </div>
      </div>

      <div className="cp-body">
        <div className="cp-pac-banner">
          <div className="pac-av" style={{ background:pac.color, width:44, height:44, fontSize:15 }}>{pac.av}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:16, fontWeight:600, color:"#fff" }}>{pac.nombre} {pac.apellido}</div>
            <div style={{ fontSize:12, color:"rgba(255,255,255,.7)", marginTop:2 }}>{pac.edad?`${pac.edad}a · `:""}{pac.dx||"Sin diagnóstico"}</div>
          </div>
          <div style={{ fontSize:12, color:"rgba(255,255,255,.5)" }}>Última: {pac.hc?.[0]?.fecha ? fmtD(pac.hc[0].fecha) : "—"}</div>
        </div>

        <div className="cp-grid2">
          <Sec title="Motivo de consulta">
            <div className="form-group"><label className="form-label">Motivo principal *</label><input className="form-input" placeholder="Control mensual..." value={f.motivo} onChange={e => set("motivo",e.target.value)}/></div>
            <div className="form-group" style={{ marginBottom:0 }}><label className="form-label">Fecha</label><input className="form-input" type="date" value={f.fecha} onChange={e => set("fecha",e.target.value)}/></div>
          </Sec>
          <Sec title="Notas generales">
            <textarea className="form-input" rows={5} style={{ resize:"none" }} placeholder="Observaciones, contexto..." value={f.notas} onChange={e => set("notas",e.target.value)}/>
          </Sec>
        </div>

        <div className="cp-sec cp-full">
          <div className="cp-sec-header">Signos vitales</div>
          <div className="cp-sec-body">
            <div className="cp-grid4">
              <div className="form-group">
                <label className="form-label">Presión arterial (mmHg)</label>
                <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                  <input className="form-input" placeholder="120" style={{ textAlign:"center" }} value={f.presion_sis} onChange={e => set("presion_sis",e.target.value)}/>
                  <span style={{ color:"#9CA3AF", fontWeight:700 }}>/</span>
                  <input className="form-input" placeholder="80" style={{ textAlign:"center" }} value={f.presion_dia} onChange={e => set("presion_dia",e.target.value)}/>
                </div>
              </div>
              <div className="form-group"><label className="form-label">Frec. cardíaca (lpm)</label><input className="form-input" placeholder="72" type="number" value={f.fc} onChange={e => set("fc",e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Temperatura (°C)</label><input className="form-input" placeholder="36.5" type="number" step="0.1" value={f.temp} onChange={e => set("temp",e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Saturación O2 (%)</label><input className="form-input" placeholder="98" type="number" value={f.spo2} onChange={e => set("spo2",e.target.value)}/></div>
            </div>
            <div className="cp-grid3" style={{ marginBottom:0 }}>
              <div className="form-group"><label className="form-label">Peso (kg)</label><input className="form-input" placeholder="70" type="number" step="0.1" value={f.peso} onChange={e => set("peso",e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Talla (cm)</label><input className="form-input" placeholder="170" type="number" value={f.talla} onChange={e => set("talla",e.target.value)}/></div>
              <div className="form-group">
                <label className="form-label">IMC calculado</label>
                {imc
                  ? <div className="imc-badge" style={{ background:`${imcC}18`, color:imcC, border:`1px solid ${imcC}40` }}>
                      <span style={{ fontSize:20, fontWeight:700 }}>{imc}</span>
                      <span style={{ fontSize:12, fontWeight:600 }}>{imcLbl}</span>
                    </div>
                  : <input className="form-input" readOnly value="Ingresá peso y talla" style={{ color:"#9CA3AF" }}/>}
              </div>
            </div>
          </div>
        </div>

        <div className="cp-grid2">
          <Sec title="Evolución clínica">
            <div className="form-group"><label className="form-label">Examen físico</label><textarea className="form-input" rows={3} style={{ resize:"none" }} placeholder="Hallazgos..." value={f.examen_fisico} onChange={e => set("examen_fisico",e.target.value)}/></div>
            <div className="form-group" style={{ marginBottom:0 }}><label className="form-label">Diagnóstico de esta consulta</label><input className="form-input" placeholder="Puede diferir del principal..." value={f.dx_consulta} onChange={e => set("dx_consulta",e.target.value)}/></div>
          </Sec>
          <Sec title="Indicaciones y estudios">
            <div className="form-group"><label className="form-label">Indicaciones al paciente</label><textarea className="form-input" rows={3} style={{ resize:"none" }} placeholder="Plan terapéutico..." value={f.indicaciones} onChange={e => set("indicaciones",e.target.value)}/></div>
            <div className="form-group" style={{ marginBottom:0 }}><label className="form-label">Estudios pedidos</label><input className="form-input" placeholder="Hemograma, RX tórax..." value={f.estudios} onChange={e => set("estudios",e.target.value)}/></div>
          </Sec>
        </div>

        <div className="cp-grid2">
          <Sec title="Medicación">
            <div className="form-group"><label className="form-label">Medicación indicada</label><input className="form-input" placeholder="Enalapril 10mg..." value={f.meds_consulta} onChange={e => set("meds_consulta",e.target.value)}/></div>
            <div className="form-group"><label className="form-label">Cambios respecto a anterior</label><input className="form-input" placeholder="Se suspende X, se agrega Y..." value={f.meds_cambios} onChange={e => set("meds_cambios",e.target.value)}/></div>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13 }}>
              <input type="checkbox" checked={f.receta} onChange={e => set("receta",e.target.checked)} style={{ width:15, height:15, accentColor:"var(--accent)" }}/>
              Se emitió receta en esta consulta
            </label>
          </Sec>
          <Sec title="Próxima cita sugerida">
            <div style={{ background:"#FEF3C7", border:"1px solid #FDE68A", borderRadius:8, padding:"10px 12px", fontSize:12, color:"#D97706", marginBottom:14 }}>Al guardar, pre-completa el formulario de nuevo turno.</div>
            <div className="form-group"><label className="form-label">Fecha sugerida</label><input className="form-input" type="date" value={f.proxima_fecha} onChange={e => set("proxima_fecha",e.target.value)}/></div>
            <div className="form-group" style={{ marginBottom:0 }}><label className="form-label">Motivo</label><input className="form-input" placeholder="Control postratamiento..." value={f.proxima_motivo} onChange={e => set("proxima_motivo",e.target.value)}/></div>
          </Sec>
        </div>

        <div className="card" style={{ padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ fontSize:13, color: f.motivo ? "var(--green)" : "#9CA3AF", fontWeight:500 }}>{f.motivo ? "✓ Listo para registrar" : "Completá el motivo para continuar"}</div>
          <div style={{ display:"flex", gap:10 }}>
            <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" disabled={busy||!f.motivo} onClick={save}>{busy?<div className="spinner"/>:<Ico n="check" s={14}/>}Registrar Consulta</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── MODALS ─────────────────────────────────────────────────
function ModalPaciente({ onClose, onSave }) {
  const [f, setF] = useState({ nombre:"", ap:"", dni:"", tel:"", email:"", dob:"", dx:"", meds:"", notas:"", tipo:"recurrente" });
  const [busy, setBusy] = useState(false);
  const set = (k,v) => setF(p => ({...p,[k]:v}));
  const save = async () => { if(!f.nombre)return; setBusy(true); await new Promise(r=>setTimeout(r,500)); onSave(f); setBusy(false); };
  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">Nuevo Paciente</div><button className="btn btn-ghost btn-icon" onClick={onClose}><Ico n="x" s={16}/></button></div>
        <div className="modal-body">
          <div className="form-row"><div className="form-group"><label className="form-label">Nombre *</label><input className="form-input" placeholder="María" value={f.nombre} onChange={e=>set("nombre",e.target.value)}/></div><div className="form-group"><label className="form-label">Apellido</label><input className="form-input" placeholder="López" value={f.ap} onChange={e=>set("ap",e.target.value)}/></div></div>
          <div className="form-row"><div className="form-group"><label className="form-label">DNI</label><input className="form-input" placeholder="30.123.456" value={f.dni} onChange={e=>set("dni",e.target.value)}/></div><div className="form-group"><label className="form-label">Fecha de nacimiento</label><input className="form-input" type="date" value={f.dob} onChange={e=>set("dob",e.target.value)}/></div></div>
          <div className="form-row"><div className="form-group"><label className="form-label">Teléfono</label><input className="form-input" placeholder="+54 11..." value={f.tel} onChange={e=>set("tel",e.target.value)}/></div><div className="form-group"><label className="form-label">Email</label><input className="form-input" placeholder="correo@..." value={f.email} onChange={e=>set("email",e.target.value)}/></div></div>
          <div className="form-group"><label className="form-label">Diagnóstico</label><input className="form-input" placeholder="Hipertensión arterial..." value={f.dx} onChange={e=>set("dx",e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Medicación actual</label><input className="form-input" placeholder="Enalapril 10mg..." value={f.meds} onChange={e=>set("meds",e.target.value)}/></div>
          <div className="form-group">
            <label className="form-label">Tipo de paciente</label>
            <div style={{ display:"flex", gap:8 }}>
              {["recurrente","nuevo"].map(t => (
                <button key={t} onClick={() => set("tipo",t)} className={`filter-chip ${f.tipo===t?"active":""}`} style={{ flex:1, justifyContent:"center" }}>
                  {t.charAt(0).toUpperCase()+t.slice(1)}
                </button>
              ))}
            </div>
          </div>
        </div>
        <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancelar</button><button className="btn btn-primary" disabled={busy} onClick={save}>{busy&&<div className="spinner"/>}Guardar Paciente</button></div>
      </div>
    </div>
  );
}

function ModalTurno({ pacs, prePacId, onClose, onSave }) {
  const [f, setF] = useState({ pid:prePacId||"", fecha:"", hora:"", motivo:"" });
  const [busy, setBusy] = useState(false);
  const set = (k,v) => setF(p => ({...p,[k]:v}));
  const save = async () => { if(!f.pid||!f.fecha||!f.hora)return; setBusy(true); await new Promise(r=>setTimeout(r,500)); onSave(f); setBusy(false); };
  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">Nuevo Turno</div><button className="btn btn-ghost btn-icon" onClick={onClose}><Ico n="x" s={16}/></button></div>
        <div className="modal-body">
          <div className="form-group"><label className="form-label">Paciente *</label><select className="form-input" value={f.pid} onChange={e=>set("pid",e.target.value)}><option value="">Seleccionar...</option>{pacs.map(p=><option key={p.id} value={p.id}>{p.nombre} {p.apellido}</option>)}</select></div>
          <div className="form-row"><div className="form-group"><label className="form-label">Fecha *</label><input className="form-input" type="date" value={f.fecha} onChange={e=>set("fecha",e.target.value)}/></div><div className="form-group"><label className="form-label">Hora *</label><input className="form-input" type="time" value={f.hora} onChange={e=>set("hora",e.target.value)}/></div></div>
          <div className="form-group"><label className="form-label">Motivo</label><input className="form-input" placeholder="Control rutinario..." value={f.motivo} onChange={e=>set("motivo",e.target.value)}/></div>
        </div>
        <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancelar</button><button className="btn btn-primary" disabled={busy} onClick={save}>{busy&&<div className="spinner"/>}Agendar Turno</button></div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────
function App() {
  const [logged,  setLogged]  = useState(false);
  const [medico,  setMedico]  = useState(null);
  const [tab,     setTab]     = useState("dashboard");
  const [view,    setView]    = useState(null);
  const [modal,   setModal]   = useState(null);
  const [toasts,  setToasts]  = useState([]);
  const [pacs,    setPacs]    = useState([]);
  const [search,  setSearch]  = useState("");

  const addToast = useCallback(msg => {
    const id = ++_tid;
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }, []);

  const removeToast = id => setToasts(t => t.filter(x => x.id !== id));

  const syncPacs = useCallback(() => {
    setPacs(DB.pacientes.map(p => ({ ...p, av: getAv(p.nombre,p.apellido), color: getColor(p.id), edad: calcEdad(p.dob) })));
  }, []);

  useEffect(() => { if (logged) syncPacs(); }, [logged, syncPacs]);

  const handleLogin = () => { setLogged(true); setMedico(DB.medico); };
  const handleOut   = async () => { await supabase.auth.signOut(); setLogged(false); setMedico(null); DB.medico=null; setTab("dashboard"); setView(null); };

  const savePaciente = f => {
    const id = "p"+Date.now();
    DB.pacientes.unshift({ id, nombre:f.nombre, apellido:f.ap||"—", dob:f.dob||null, dni:f.dni, tel:f.tel, email:f.email, tipo:f.tipo, dx:f.dx, meds:f.meds, notas:f.notas, turnos:[], hc:[], adj:[] });
    DB.recs[id] = []; syncPacs(); addToast("Paciente agregado"); setModal(null);
  };

  const saveTurno = f => {
    const id = "t"+Date.now();
    const t = { id, fecha:f.fecha, hora:f.hora, motivo:f.motivo||"Control", estado:"programado" };
    const pac = DB.pacientes.find(p => p.id === f.pid);
    if (pac) { if (!pac.turnos) pac.turnos=[]; pac.turnos.push(t); }
    DB.recs[id] = []; syncPacs(); addToast("Turno agendado"); setModal(null);
  };

  const selPac = view?.type === "detail" ? pacs.find(p => p.id === view.id) : null;

  const NAV = [
    { id:"dashboard", ico:"home",     lbl:"Inicio" },
    { id:"patients",  ico:"users",    lbl:"Pacientes", badge: pacs.filter(p=>p.tipo==="nuevo").length },
    { id:"calendar",  ico:"cal",      lbl:"Agenda",    badge: pacs.flatMap(p=>p.turnos||[]).filter(t=>t.fecha===HOY).length || 0 },
    { id:"analytics", ico:"chart",    lbl:"Métricas" },
    { id:"settings",  ico:"settings", lbl:"Ajustes" },
  ];

  const topTitle = view?.type==="detail" && selPac
    ? selPac.nombre + " " + selPac.apellido
    : { dashboard:"Inicio", patients:"Pacientes", calendar:"Agenda", analytics:"Métricas", settings:"Ajustes" }[tab];

  if (!logged) return <Auth onLogin={handleLogin}/>;

  return (
    <div className="app">
      {/* SIDEBAR */}
      <aside className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-icon"><Ico n="shield" s={18} c="#fff"/></div>
          <div className="sb-logo-text">MediTrack</div>
          <div className="sb-logo-badge">PRO</div>
        </div>

        <div className="sb-scroll">
          <div className="sb-section">Principal</div>
          {NAV.map(n => (
            <button key={n.id} className={`sb-item ${(tab===n.id&&!view)||("patients"===n.id&&view?.type==="detail")?"active":""}`}
              onClick={() => { setTab(n.id); setView(null); }}>
              <Ico n={n.ico} s={16}/>{n.lbl}
              {n.badge > 0 && <span className="sb-badge">{n.badge}</span>}
            </button>
          ))}
        </div>

        <div className="sb-footer">
          <div className="sb-user" onClick={handleOut} title="Cerrar sesión">
            <div className="sb-av">{getAv(medico?.nombre||"",medico?.apellido||"")}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div className="sb-uname">Dr. {medico?.nombre} {medico?.apellido}</div>
              <div className="sb-urole">{medico?.especialidad}</div>
            </div>
            <Ico n="logout" s={15} c="#9CA3AF"/>
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <div className="main">
        <div className="topbar">
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {view?.type==="detail" && (
              <button className="btn btn-ghost btn-icon" onClick={() => setView(null)}><Ico n="back" s={16}/></button>
            )}
            <div className="topbar-title">{topTitle}</div>
          </div>

          <div className="topbar-search">
            <Ico n="search" s={15} c="#9CA3AF"/>
            <input placeholder="Buscar pacientes, turnos..." value={search} onChange={e => setSearch(e.target.value)}/>
          </div>

          <div className="topbar-right">
            <button className="icon-btn"><Ico n="bell" s={17}/></button>
            {tab === "dashboard" && (
              <button className="btn btn-primary" onClick={() => setModal("paciente")}><Ico n="plus" s={15}/>Nuevo Paciente</button>
            )}
          </div>
        </div>

        <div className="content">
          {tab==="dashboard" && !view && <Dashboard pacs={pacs} addToast={addToast}/>}
          {tab==="patients"  && !view && <Patients pacs={pacs} onSelect={id=>setView({type:"detail",id})} onNew={()=>setModal("paciente")}/>}
          {tab==="patients"  && view?.type==="detail" && selPac && <PatientDetail pac={selPac} onBack={()=>setView(null)} addToast={addToast} syncPacs={syncPacs} onNewTurno={()=>setModal("turno-from-patient")}/>}
          {tab==="calendar"  && <CalendarPage pacs={pacs} addToast={addToast} onNew={()=>setModal("turno")}/>}
          {tab==="analytics" && <Analytics pacs={pacs}/>}
          {tab==="settings"  && <Settings medico={medico} addToast={addToast}/>}
        </div>
      </div>

      {modal==="paciente"           && <ModalPaciente onClose={()=>setModal(null)} onSave={savePaciente}/>}
      {modal==="turno"              && <ModalTurno pacs={pacs} prePacId={null} onClose={()=>setModal(null)} onSave={saveTurno}/>}
      {modal==="turno-from-patient" && selPac && <ModalTurno pacs={pacs} prePacId={selPac.id} onClose={()=>setModal(null)} onSave={saveTurno}/>}

      <Toasts list={toasts} remove={removeToast}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
